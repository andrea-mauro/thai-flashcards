<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }

        .mode-btn:not(.active) {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .mode-btn:hover {
            transform: scale(1.05);
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 8px 16px;
            font-size: 0.9rem;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: white;
        }

        .category-btn.active, .category-btn:hover {
            background: white;
            color: #667eea;
        }

        .stats-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Flashcard Styles */
        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .flashcard {
            perspective: 1000px;
            height: 280px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .flashcard-front {
            background: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            transform: rotateY(180deg);
        }

        .thai-text {
            font-size: 2.5rem;
            color: #c0392b;
            margin-bottom: 15px;
            text-align: center;
        }

        .card-number {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .card-category {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .english-text {
            font-size: 1.2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        .romanization {
            font-size: 1.1rem;
            color: #8e44ad;
            font-style: italic;
            margin-bottom: 15px;
            text-align: center;
        }

        .audio-btn {
            background: #27ae60;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:hover {
            background: #219a52;
            transform: scale(1.1);
        }

        .audio-btn.playing {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .diff-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .diff-btn.easy {
            background: #27ae60;
            color: white;
        }

        .diff-btn.hard {
            background: #e74c3c;
            color: white;
        }

        .diff-btn:hover {
            transform: scale(1.05);
        }

        /* Quiz Mode Styles */
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .quiz-question {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-thai {
            font-size: 3rem;
            color: #c0392b;
            margin-bottom: 20px;
        }

        .quiz-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 3px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .quiz-input.correct {
            border-color: #27ae60;
            background: #d5f5e3;
        }

        .quiz-input.incorrect {
            border-color: #e74c3c;
            background: #fadbd8;
        }

        .quiz-feedback {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .quiz-feedback.correct {
            color: #27ae60;
        }

        .quiz-feedback.incorrect {
            color: #e74c3c;
        }

        .quiz-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .quiz-btn.check {
            background: #667eea;
            color: white;
        }

        .quiz-btn.next {
            background: #27ae60;
            color: white;
            display: none;
        }

        .quiz-btn:hover {
            transform: scale(1.02);
        }

        .quiz-hint {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #ecf0f1;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .control-btn:hover {
            background: white;
            color: #667eea;
        }

        .shuffle-btn {
            background: #f39c12;
            border-color: #f39c12;
        }

        .shuffle-btn:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .flashcard-container {
                grid-template-columns: 1fr;
            }

            .thai-text {
                font-size: 2rem;
            }

            .quiz-thai {
                font-size: 2.5rem;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Settings panel */
        .settings-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .settings-panel h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #667eea;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🇹🇭 Thai Flashcards</h1>
            <p>Learn Thai vocabulary and phrases</p>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="flashcards">📇 Flashcards</button>
            <button class="mode-btn" data-mode="quiz">✏️ Quiz Mode</button>
        </div>

        <div class="category-filter" id="categoryFilter">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="introduction">Introduction</button>
            <button class="category-btn" data-category="family">Family</button>
            <button class="category-btn" data-category="routine">Daily Routine</button>
            <button class="category-btn" data-category="technology">Technology</button>
            <button class="category-btn" data-category="pets">Pets & Animals</button>
            <button class="category-btn" data-category="kitchen">Kitchen</button>
            <button class="category-btn" data-category="bathroom">Bathroom</button>
            <button class="category-btn" data-category="travel">Travel</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalCards">0</div>
                <div class="stat-label">Total Cards</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="learnedCards">0</div>
                <div class="stat-label">Learned</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="streakCount">0</div>
                <div class="stat-label">Day Streak</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracyRate">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn shuffle-btn" id="shuffleBtn">🔀 Shuffle</button>
            <button class="control-btn" id="resetBtn">🔄 Reset Progress</button>
            <button class="control-btn" id="settingsBtn">⚙️ Settings</button>
        </div>

        <div id="flashcardsView">
            <div class="flashcard-container" id="flashcardContainer"></div>
        </div>

        <div id="quizView" style="display: none;">
            <div class="quiz-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="quizProgress" style="width: 0%"></div>
                </div>
                <div class="quiz-question">
                    <div class="quiz-thai" id="quizThai"></div>
                    <div class="quiz-feedback" id="quizFeedback"></div>
                </div>
                <input type="text" class="quiz-input" id="quizInput" placeholder="Type the romanization..." autocomplete="off">
                <button class="quiz-btn check" id="quizCheckBtn">Check Answer</button>
                <button class="quiz-btn next" id="quizNextBtn">Next →</button>
                <div class="quiz-hint" id="quizHint"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

        // State management
        let currentMode = 'flashcards';
        let currentCategory = 'all';
        let currentCards = [...flashcardData];
        let learnedCards = new Set();
        let quizIndex = 0;
        let quizScore = { correct: 0, total: 0 };
        let streakData = loadStreakData();

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('thaiFlashcards_learned');
            if (saved) {
                learnedCards = new Set(JSON.parse(saved));
            }
            updateStats();
        }

        function saveProgress() {
            localStorage.setItem('thaiFlashcards_learned', JSON.stringify([...learnedCards]));
        }

        function loadStreakData() {
            const saved = localStorage.getItem('thaiFlashcards_streak');
            if (saved) {
                return JSON.parse(saved);
            }
            return { count: 0, lastDate: null };
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (streakData.lastDate !== today) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (streakData.lastDate === yesterday.toDateString()) {
                    streakData.count++;
                } else if (streakData.lastDate !== today) {
                    streakData.count = 1;
                }
                streakData.lastDate = today;
                localStorage.setItem('thaiFlashcards_streak', JSON.stringify(streakData));
            }
            updateStats();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            renderFlashcards();
            setupEventListeners();
            updateStats();
        });

        // Setup event listeners
        function setupEventListeners() {
            // Mode switching
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentMode = e.target.dataset.mode;
                    toggleViews();
                });
            });

            // Category filtering
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    filterCards();
                });
            });

            // Controls
            document.getElementById('shuffleBtn').addEventListener('click', shuffleCards);
            document.getElementById('resetBtn').addEventListener('click', resetProgress);
            document.getElementById('quizCheckBtn').addEventListener('click', checkQuizAnswer);
            document.getElementById('quizNextBtn').addEventListener('click', nextQuizQuestion);
            document.getElementById('quizInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkQuizAnswer();
                }
            });
        }

        // Toggle views
        function toggleViews() {
            document.getElementById('flashcardsView').style.display = currentMode === 'flashcards' ? 'block' : 'none';
            document.getElementById('quizView').style.display = currentMode === 'quiz' ? 'block' : 'none';
            if (currentMode === 'quiz') {
                startQuiz();
            }
        }

        // Filter cards by category
        function filterCards() {
            if (currentCategory === 'all') {
                currentCards = [...flashcardData];
            } else {
                currentCards = flashcardData.filter(card => card.category === currentCategory);
            }
            renderFlashcards();
        }

        // Shuffle cards
        function shuffleCards() {
            for (let i = currentCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
            }
            renderFlashcards();
            showToast('Cards shuffled!');
        }

        // Render flashcards
        function renderFlashcards() {
            const container = document.getElementById('flashcardContainer');
            container.innerHTML = '';

            currentCards.forEach((card, index) => {
                const flashcard = document.createElement('div');
                flashcard.className = 'flashcard';
                flashcard.innerHTML = `
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <span class="card-number">${card.id}</span>
                            <span class="card-category">${card.category}</span>
                            <div class="english-text" style="font-size: 1.3rem;">${card.english}</div>
                            <div style="color: #7f8c8d; font-size: 0.9rem; margin-top: 15px;">Click to reveal Thai</div>
                        </div>
                        <div class="flashcard-back">
                            <span class="card-number">${card.id}</span>
                            <span class="card-category">${card.category}</span>
                            <div class="thai-text">${card.thai}</div>
                            <div class="romanization">${card.romanization}</div>
                            <button class="audio-btn" onclick="playAudio('${card.thai}', this)">🔊</button>
                            <div class="difficulty-buttons">
                                <button class="diff-btn easy" onclick="markLearned(${card.id}, event)">✓ Learned</button>
                                <button class="diff-btn hard" onclick="markHard(${card.id}, event)">✗ Hard</button>
                            </div>
                        </div>
                    </div>
                `;

                flashcard.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('audio-btn') && !e.target.classList.contains('diff-btn')) {
                        flashcard.classList.toggle('flipped');
                    }
                });

                container.appendChild(flashcard);
            });
        }

        // Play audio using Web Speech API
        function playAudio(text, btn) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.8;
                utterance.pitch = 1;

                btn.classList.add('playing');

                utterance.onend = () => {
                    btn.classList.remove('playing');
                };

                speechSynthesis.speak(utterance);
            } else {
                showToast('Text-to-speech not supported in this browser');
            }
        }

        // Mark card as learned
        function markLearned(id, event) {
            event.stopPropagation();
            learnedCards.add(id);
            saveProgress();
            updateStats();
            showToast('Marked as learned! ✓');
        }

        // Mark card as hard
        function markHard(id, event) {
            event.stopPropagation();
            showToast('Keep practicing! 💪');
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalCards').textContent = flashcardData.length;
            document.getElementById('learnedCards').textContent = learnedCards.size;
            document.getElementById('streakCount').textContent = streakData.count;
            const accuracy = quizScore.total > 0 ? Math.round((quizScore.correct / quizScore.total) * 100) : 0;
            document.getElementById('accuracyRate').textContent = accuracy + '%';
        }

        // Reset progress
        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress?')) {
                learnedCards.clear();
                saveProgress();
                quizScore = { correct: 0, total: 0 };
                updateStats();
                showToast('Progress reset!');
            }
        }

        // Quiz mode
        function startQuiz() {
            quizIndex = 0;
            currentCards = currentCategory === 'all' ? [...flashcardData] : flashcardData.filter(c => c.category === currentCategory);
            shuffleCards();
            showQuizQuestion();
        }

        function showQuizQuestion() {
            if (quizIndex >= currentCards.length) {
                endQuiz();
                return;
            }

            const card = currentCards[quizIndex];
            document.getElementById('quizThai').textContent = card.thai;
            document.getElementById('quizInput').value = '';
            document.getElementById('quizInput').className = 'quiz-input';
            document.getElementById('quizFeedback').textContent = '';
            document.getElementById('quizFeedback').className = 'quiz-feedback';
            document.getElementById('quizCheckBtn').style.display = 'block';
            document.getElementById('quizNextBtn').style.display = 'none';
            document.getElementById('quizHint').textContent = `Card ${quizIndex + 1} of ${currentCards.length}`;

            const progress = ((quizIndex) / currentCards.length) * 100;
            document.getElementById('quizProgress').style.width = progress + '%';

            document.getElementById('quizInput').focus();
        }

        function checkQuizAnswer() {
            const input = document.getElementById('quizInput').value.trim().toLowerCase();
            const card = currentCards[quizIndex];
            const correct = card.romanization.toLowerCase();

            // Simple matching - check if input contains key parts of romanization
            const isCorrect = input === correct || correct.includes(input) || input.includes(correct.split(' ')[0]);

            const feedback = document.getElementById('quizFeedback');
            const quizInput = document.getElementById('quizInput');

            if (isCorrect) {
                feedback.textContent = '✓ Correct! ' + card.romanization;
                feedback.className = 'quiz-feedback correct';
                quizInput.className = 'quiz-input correct';
                quizScore.correct++;
                playAudio(card.thai);
            } else {
                feedback.textContent = '✗ Incorrect. Answer: ' + card.romanization;
                feedback.className = 'quiz-feedback incorrect';
                quizInput.className = 'quiz-input incorrect';
            }

            quizScore.total++;
            updateStats();

            document.getElementById('quizCheckBtn').style.display = 'none';
            document.getElementById('quizNextBtn').style.display = 'block';
            document.getElementById('quizNextBtn').focus();
        }

        function nextQuizQuestion() {
            quizIndex++;
            showQuizQuestion();
        }

        function endQuiz() {
            const percentage = Math.round((quizScore.correct / quizScore.total) * 100);
            document.getElementById('quizThai').textContent = '🎉 Quiz Complete!';
            document.getElementById('quizFeedback').textContent = `Score: ${quizScore.correct}/${quizScore.total} (${percentage}%)`;
            document.getElementById('quizFeedback').className = 'quiz-feedback correct';
            document.getElementById('quizInput').style.display = 'none';
            document.getElementById('quizCheckBtn').style.display = 'none';
            document.getElementById('quizNextBtn').style.display = 'none';
            document.getElementById('quizProgress').style.width = '100%';
            document.getElementById('quizHint').textContent = 'Refresh or change category to start again';

            updateStreak();
            showToast(`Great job! ${percentage}% accuracy`);
        }

        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
